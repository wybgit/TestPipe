env_profile:
  host:
    mode: docker
    workdir: /workspace/testpipe
    docker_image: ascend-toolkit:latest
  device:
    protocol: ssh
    host: 192.168.1.10
    port: 22
    user: root
    remote_root: /home/root/testpipe
    workdir: workspace
    connect_timeout: 10
    ssh_options:
      - StrictHostKeyChecking=no
      - UserKnownHostsFile=/dev/null
  transport:
    mode: sftp
    size_threshold_mb: 128
  metadata:
    profile_name: ssh_device
