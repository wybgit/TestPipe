pipeline_name: GeneratedCompilePipeline
business_goal: 拉取资源、编译并传输产物
pipeline_inputs:
  - resource_path
pipeline_outputs:
  - remote_path
stages:
  - name: prepare
  - name: compile
  - name: transfer
required_ops:
  - ResourceFetch
  - ATCCompile
  - Transfer
scaffold:
  enabled: true
  root_dir: generated
